<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Georgia, 'Times New Roman', serif">
<title>Debt Service example</title>
<rect width="900" height="260" fill="#f4efe4"/>
<text x="30" y="40" font-size="15" fill="#2f2a25" text-anchor="start" font-weight="bold">Orange has $15,000 Debt: Debt Service is $3,000 when due.</text><line x1="70" y1="150" x2="850" y2="150" stroke="#2f2a25" stroke-width="3"/><rect x="24" y="70" width="132" height="54" rx="8" fill="#dfe8d8" stroke="#8b8275"/><text x="90" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Boston</text><text x="90" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">Northeast</text><circle cx="90" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="90" y="182" font-size="20" fill="#4e8a4a" text-anchor="middle" font-weight="bold">$0</text><text x="90" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">East</text><rect x="174" y="70" width="132" height="54" rx="8" fill="#dfe8d8" stroke="#8b8275"/><text x="240" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Atlanta</text><text x="240" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">Southeast</text><circle cx="240" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="240" y="182" font-size="20" fill="#4e8a4a" text-anchor="middle" font-weight="bold">$0</text><text x="240" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">East</text><rect x="324" y="70" width="132" height="54" rx="8" fill="#e9e1c8" stroke="#8b8275"/><text x="390" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Cleveland</text><text x="390" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">North Central</text><circle cx="390" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="390" y="182" font-size="20" fill="#b8423a" text-anchor="middle" font-weight="bold">$3,000</text><text x="390" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">first Central</text><rect x="474" y="70" width="132" height="54" rx="8" fill="#e9e1c8" stroke="#8b8275"/><text x="540" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Kansas City</text><text x="540" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">South Central</text><circle cx="540" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="540" y="182" font-size="20" fill="#4e8a4a" text-anchor="middle" font-weight="bold">$0</text><text x="540" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">Central again</text><rect x="624" y="70" width="132" height="54" rx="8" fill="#e4d3c8" stroke="#8b8275"/><text x="690" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Denver</text><text x="690" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">Southwest</text><circle cx="690" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="690" y="182" font-size="20" fill="#b8423a" text-anchor="middle" font-weight="bold">$3,000</text><text x="690" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">first West</text><rect x="774" y="70" width="132" height="54" rx="8" fill="#e4d3c8" stroke="#8b8275"/><text x="840" y="92" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Boston</text><text x="840" y="112" font-size="11.5" fill="#6b6257" text-anchor="middle">Northeast</text><circle cx="840" cy="150" r="9" fill="#fff" stroke="#2f2a25" stroke-width="2.5"/><text x="840" y="182" font-size="20" fill="#b8423a" text-anchor="middle" font-weight="bold">$3,000</text><text x="840" y="202" font-size="11.5" fill="#6b6257" text-anchor="middle">after the West</text><text x="30" y="240" font-size="12.5" fill="#6b6257" text-anchor="start" font-style="italic">Deliveries in order, left to right. After the first Western delivery, every delivery pays.</text>
<g transform="translate(888,18)"><text text-anchor="end" font-size="11" letter-spacing="1.5" fill="#b0412e" font-family="Arial, sans-serif" font-weight="bold">DRAFT · FIG. 8</text></g>
</svg>
