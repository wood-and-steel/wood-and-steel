<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Georgia, 'Times New Roman', serif">
<title>The game loop</title>
<rect width="900" height="430" fill="#f4efe4"/>
<circle cx="450" cy="215" r="140" fill="none" stroke="#8b8275" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><rect x="355" y="37" width="190" height="76" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="450" y="63" font-size="18" fill="#2f2a25" text-anchor="middle" font-weight="bold">Deliver</text><text x="450" y="84" font-size="12.5" fill="#6b6257" text-anchor="middle">Run engines, pick up</text><text x="450" y="101" font-size="12.5" fill="#6b6257" text-anchor="middle">and fulfill Contracts</text><g transform="translate(568.79393923934,116.00505063388336) rotate(45)"><path d="M-10,-6 L10,0 L-10,6 Z" fill="#b8423a"/></g><rect x="572" y="177" width="190" height="76" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="667" y="203" font-size="18" fill="#2f2a25" text-anchor="middle" font-weight="bold">Earn</text><text x="667" y="224" font-size="12.5" fill="#6b6257" text-anchor="middle">Cash and</text><text x="667" y="241" font-size="12.5" fill="#6b6257" text-anchor="middle">Railroad Ties</text><g transform="translate(568.79393923934,313.99494936611666) rotate(135)"><path d="M-10,-6 L10,0 L-10,6 Z" fill="#b8423a"/></g><rect x="355" y="317" width="190" height="76" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="450" y="343" font-size="18" fill="#2f2a25" text-anchor="middle" font-weight="bold">Invest</text><text x="450" y="364" font-size="12.5" fill="#6b6257" text-anchor="middle">Track, engines,</text><text x="450" y="381" font-size="12.5" fill="#6b6257" text-anchor="middle">Upgrades (or borrow)</text><g transform="translate(331.20606076066,313.99494936611666) rotate(225)"><path d="M-10,-6 L10,0 L-10,6 Z" fill="#b8423a"/></g><rect x="138" y="177.00000000000003" width="190" height="76" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="233" y="203.00000000000003" font-size="18" fill="#2f2a25" text-anchor="middle" font-weight="bold">Reach farther</text><text x="233" y="224.00000000000003" font-size="12.5" fill="#6b6257" text-anchor="middle">Bigger Contracts</text><text x="233" y="241.00000000000003" font-size="12.5" fill="#6b6257" text-anchor="middle">across more Regions</text><g transform="translate(331.20606076065997,116.00505063388336) rotate(315)"><path d="M-10,-6 L10,0 L-10,6 Z" fill="#b8423a"/></g><text x="450" y="211" font-size="15" fill="#2f2a25" text-anchor="middle" font-weight="bold">Two Actions</text><text x="450" y="231" font-size="13" fill="#6b6257" text-anchor="middle">a turn</text><text x="450" y="410" font-size="13" fill="#6b6257" text-anchor="middle" font-style="italic">Between rounds, Independent Railroads grow and the Market changes.</text>
<g transform="translate(888,18)"><text text-anchor="end" font-size="11" letter-spacing="1.5" fill="#b0412e" font-family="Arial, sans-serif" font-weight="bold">DRAFT · FIG. 1</text></g>
</svg>
