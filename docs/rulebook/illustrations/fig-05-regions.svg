<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Georgia, 'Times New Roman', serif">
<title>Regions, Railroad Ties and Debt Service</title>
<rect width="900" height="480" fill="#f4efe4"/>
<rect x="120" y="56" width="200" height="274" fill="#e4d3c8"/><text x="220" y="78" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">West</text><rect x="320" y="56" width="200" height="274" fill="#e9e1c8"/><text x="420" y="78" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Central</text><rect x="520" y="56" width="200" height="274" fill="#dfe8d8"/><text x="620" y="78" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">East</text><rect x="128" y="98" width="184" height="104" rx="8" fill="#fffdf8" stroke="#8b8275" stroke-width="1"/><text x="220" y="124" font-size="14" fill="#2f2a25" text-anchor="middle">Northwest</text><text x="220" y="170" font-size="34" fill="#2f2a25" text-anchor="middle" font-weight="bold">4</text><rect x="328" y="98" width="184" height="104" rx="8" fill="#fffdf8" stroke="#8b8275" stroke-width="1"/><text x="420" y="124" font-size="14" fill="#2f2a25" text-anchor="middle">North Central</text><text x="420" y="170" font-size="34" fill="#2f2a25" text-anchor="middle" font-weight="bold">3</text><rect x="528" y="98" width="184" height="104" rx="8" fill="#fffdf8" stroke="#8b8275" stroke-width="1"/><text x="620" y="124" font-size="14" fill="#2f2a25" text-anchor="middle">Northeast</text><text x="620" y="170" font-size="34" fill="#2f2a25" text-anchor="middle" font-weight="bold">2</text><rect x="128" y="218" width="184" height="104" rx="8" fill="#fffdf8" stroke="#8b8275" stroke-width="1"/><text x="220" y="244" font-size="14" fill="#2f2a25" text-anchor="middle">Southwest</text><text x="220" y="290" font-size="34" fill="#2f2a25" text-anchor="middle" font-weight="bold">3</text><rect x="328" y="218" width="184" height="104" rx="8" fill="#fffdf8" stroke="#8b8275" stroke-width="1"/><text x="420" y="244" font-size="14" fill="#2f2a25" text-anchor="middle">South Central</text><text x="420" y="290" font-size="34" fill="#2f2a25" text-anchor="middle" font-weight="bold">2</text><rect x="528" y="218" width="184" height="104" rx="8" fill="#fff" stroke="#b8423a" stroke-width="3"/><text x="620" y="244" font-size="14" fill="#2f2a25" text-anchor="middle">Southeast</text><text x="620" y="290" font-size="15" fill="#b8423a" text-anchor="middle" font-weight="bold">Destination</text><text x="620" y="310" font-size="12" fill="#6b6257" text-anchor="middle">same Region: 1</text><text x="450" y="34" font-size="14" fill="#2f2a25" text-anchor="middle" font-weight="bold">Railroad Ties for delivering to the Southeast, by where the Commodity comes from</text><text x="120" y="370" font-size="14" fill="#2f2a25" text-anchor="start" font-weight="bold">Debt Service, by where you deliver</text><rect x="120" y="384" width="18" height="18" fill="#e4d3c8" stroke="#8b8275"/><text x="148" y="398" font-size="13" fill="#2f2a25" text-anchor="start">West: Due on your first delivery here and every delivery after, anywhere</text><rect x="120" y="412" width="18" height="18" fill="#e9e1c8" stroke="#8b8275"/><text x="148" y="426" font-size="13" fill="#2f2a25" text-anchor="start">Central: Due once, on your first delivery here</text><rect x="120" y="440" width="18" height="18" fill="#dfe8d8" stroke="#8b8275"/><text x="148" y="454" font-size="13" fill="#2f2a25" text-anchor="start">East: Not due, unless you have already delivered to the West</text>
<g transform="translate(888,18)"><text text-anchor="end" font-size="11" letter-spacing="1.5" fill="#b0412e" font-family="Arial, sans-serif" font-weight="bold">DRAFT · FIG. 5</text></g>
