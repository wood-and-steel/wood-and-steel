<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Georgia, 'Times New Roman', serif">
<title>Upgrades as deeds</title>
<rect width="900" height="470" fill="#f4efe4"/>
<rect x="20" y="40" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="25" y="45" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="155" y="70" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">SERVICE YARD</text><text x="155" y="94" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$10,000</text><text x="155" y="120" font-size="12" fill="#2f2a25" text-anchor="middle">Consolidation and better: +1 Range</text><text x="155" y="144" font-size="11" fill="#6b6257" text-anchor="middle" font-style="italic">Once anyone owns a Consolidation</text><rect x="310" y="40" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="315" y="45" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="445" y="70" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">UPGRADED STATIONS</text><text x="445" y="94" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$10,000</text><text x="445" y="120" font-size="12" fill="#2f2a25" text-anchor="middle">+$3,000 every delivery</text><rect x="600" y="40" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="605" y="45" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="735" y="70" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">ROUNDHOUSE</text><text x="735" y="94" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$10,000</text><text x="735" y="120" font-size="12" fill="#2f2a25" text-anchor="middle">Relay a Commodity between your Engines</text><rect x="20" y="180" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="25" y="185" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="155" y="210" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">EMPLOYMENT OFFICE</text><text x="155" y="234" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$10,000</text><text x="155" y="260" font-size="12" fill="#2f2a25" text-anchor="middle">Build 3 Routes per Action</text><rect x="310" y="180" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="315" y="185" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="445" y="210" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">RAILYARD</text><text x="445" y="234" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$10,000</text><text x="445" y="260" font-size="12" fill="#2f2a25" text-anchor="middle">One City supplies all within 2 Routes</text><text x="445" y="284" font-size="11" fill="#6b6257" text-anchor="middle" font-style="italic">Disc on the map</text><rect x="600" y="180" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="605" y="185" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="735" y="210" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">HUB</text><text x="735" y="234" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$15,000</text><text x="735" y="260" font-size="12" fill="#2f2a25" text-anchor="middle">Engine skip, extra offer, track discount</text><text x="735" y="284" font-size="11" fill="#6b6257" text-anchor="middle" font-style="italic">Disc on the map</text><rect x="20" y="320" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="25" y="325" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="155" y="350" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">TIMETABLE</text><text x="155" y="374" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$15,000</text><text x="155" y="400" font-size="12" fill="#2f2a25" text-anchor="middle">Keep moving after a delivery</text><rect x="310" y="320" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="315" y="325" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="445" y="350" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">REGIONAL OFFICE</text><text x="445" y="374" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$20,000</text><text x="445" y="400" font-size="12" fill="#2f2a25" text-anchor="middle">+2 Ties at end; extra offer</text><text x="445" y="424" font-size="11" fill="#6b6257" text-anchor="middle" font-style="italic">5 Cities in a Region nobody else is in</text><rect x="600" y="320" width="270" height="124" rx="6" fill="#fffdf6" stroke="#2f2a25" stroke-width="1.2"/><rect x="605" y="325" width="260" height="114" rx="4" fill="none" stroke="#8b8275" stroke-dasharray="3 3"/><text x="735" y="350" font-size="13.5" fill="#2f2a25" text-anchor="middle" font-weight="bold">COMMODITIES EXCHANGE</text><text x="735" y="374" font-size="18" fill="#b8423a" text-anchor="middle" font-weight="bold">$20,000</text><text x="735" y="400" font-size="12" fill="#2f2a25" text-anchor="middle">Monopoly: 2–4 Ties at end</text><text x="735" y="424" font-size="11" fill="#6b6257" text-anchor="middle" font-style="italic">Reach every City supplying it</text>
<g transform="translate(888,18)"><text text-anchor="end" font-size="11" letter-spacing="1.5" fill="#b0412e" font-family="Arial, sans-serif" font-weight="bold">DRAFT · FIG. 12</text></g>
</svg>
