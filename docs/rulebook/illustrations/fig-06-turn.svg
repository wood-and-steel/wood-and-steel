<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Georgia, 'Times New Roman', serif">
<title>A turn at a glance</title>
<rect width="900" height="410" fill="#f4efe4"/>
<rect x="20" y="50" width="250" height="230" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="145" y="76" font-size="16" fill="#2f2a25" text-anchor="middle" font-weight="bold">1 · Action</text><text x="36" y="100" font-size="12.5" fill="#2f2a25" text-anchor="start">Run Trains</text><text x="36" y="119" font-size="12.5" fill="#2f2a25" text-anchor="start">Build Track</text><text x="36" y="138" font-size="12.5" fill="#2f2a25" text-anchor="start">Buy an Engine</text><text x="36" y="157" font-size="12.5" fill="#2f2a25" text-anchor="start">Buy an Upgrade</text><text x="36" y="176" font-size="12.5" fill="#2f2a25" text-anchor="start">Acquire an Indep. Railroad</text><text x="36" y="195" font-size="12.5" fill="#2f2a25" text-anchor="start">Borrow Money · Repay Debt</text><text x="36" y="214" font-size="12.5" fill="#2f2a25" text-anchor="start">Discard and Draw a New Contract</text><line x1="270" y1="165" x2="312" y2="165" stroke="#2f2a25" stroke-width="2"/><path d="M320,165 l-10,-6 v12 z" fill="#2f2a25"/><rect x="320" y="50" width="250" height="230" rx="10" fill="#fff" stroke="#2f2a25" stroke-width="1.5"/><text x="445" y="76" font-size="16" fill="#2f2a25" text-anchor="middle" font-weight="bold">2 · Action</text><text x="336" y="100" font-size="12.5" fill="#2f2a25" text-anchor="start">Any Action except one</text><text x="336" y="119" font-size="12.5" fill="#2f2a25" text-anchor="start">you already took this turn</text><text x="336" y="138" font-size="12.5" fill="#2f2a25" text-anchor="start"></text><text x="336" y="157" font-size="12.5" fill="#2f2a25" text-anchor="start">Run Trains may be taken</text><text x="336" y="176" font-size="12.5" fill="#2f2a25" text-anchor="start">twice: each Engine still</text><text x="336" y="195" font-size="12.5" fill="#2f2a25" text-anchor="start">runs only once per turn.</text><line x1="570" y1="165" x2="612" y2="165" stroke="#2f2a25" stroke-width="2"/><path d="M620,165 l-10,-6 v12 z" fill="#2f2a25"/><rect x="620" y="110" width="150" height="110" rx="10" fill="#f3ece0" stroke="#2f2a25" stroke-width="1.5"/><text x="695" y="136" font-size="16" fill="#2f2a25" text-anchor="middle" font-weight="bold">3 · End Turn</text><text x="636" y="160" font-size="12.5" fill="#2f2a25" text-anchor="start">Press End Turn</text><text x="636" y="179" font-size="12.5" fill="#2f2a25" text-anchor="start">in the app</text><rect x="20" y="300" width="750" height="92" rx="10" fill="#eef3ea" stroke="#4e8a4a" stroke-width="1.5"/><text x="395" y="326" font-size="16" fill="#2f2a25" text-anchor="middle" font-weight="bold">Free Actions — any time in your turn, between or during Actions</text><text x="36" y="350" font-size="12.5" fill="#2f2a25" text-anchor="start">Pick up a Commodity  ·  Claim a Market Contract (with a Mogul or better)  ·  Record Cargo in the app  ·  Undo</text><text x="36" y="369" font-size="12.5" fill="#2f2a25" text-anchor="start"></text><text x="785" y="170" font-size="12" fill="#6b6257" text-anchor="start">→ next player</text><text x="20" y="30" font-size="13" fill="#6b6257" text-anchor="start" font-style="italic">Up to two Actions. You may take fewer.</text>
<g transform="translate(888,18)"><text text-anchor="end" font-size="11" letter-spacing="1.5" fill="#b0412e" font-family="Arial, sans-serif" font-weight="bold">DRAFT · FIG. 6</text></g>
</svg>
